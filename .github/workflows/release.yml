name: Release

# Push a tag like v1.2.0 to build IdleVeil with that version and attach the setup exe,
# the portable zip, the bare IdleVeil.exe and SHA256SUMS.txt (used by the self-updater)
# to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          .\build.ps1 -Version $v
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $v = $tag.TrimStart('v')
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "IdleVeil $v" --generate-notes
          }
          gh release upload $tag dist\IdleVeil.exe dist\SHA256SUMS.txt "dist\IdleVeil-Setup-$v.exe" "dist\IdleVeil-$v-portable.zip" --clobber
